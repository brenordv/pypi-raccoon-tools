[project]
name = "raccoontools-db"
version = "1.1.0"
description = "A collection of utilities to be used with databases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Breno RdV", email = "hello@raccoon.ninja" },
]
maintainers = [
    { name = "Breno RdV", email = "hello@raccoon.ninja" },
]
keywords = ["database", "db", "utilities", "tools", "helpers", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "psycopg[binary,pool]~=3.3.6",
    "simple-log-factory==2.0.0",

    # Adding this dependency explicitly to solve security issues while requests doesn't catch up. Refs:
    # https://github.com/brenordv/pypi-raccoon-tools/security/dependabot/5
    # https://github.com/brenordv/pypi-raccoon-tools/security/dependabot/6
    "idna>=3.20"
]
requires-python = ">=3.11"

[project.optional-dependencies]
otel = ["simple-log-factory-ext-otel[psycopg]==2.0.0"]
fastapi = ["simple-log-factory-ext-otel[fastapi]==2.0.0"]
all = ["simple-log-factory-ext-otel[fastapi,psycopg]==2.0.0"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-asyncio==1.4.1",
    "mypy==2.4.1",
    "ruff==0.17.3",
]

[project.urls]
"Homepage" = "https://github.com/brenordv/pypi-raccoon-tools"
"Source" = "https://github.com/brenordv/pypi-raccoon-tools"
"Bug Tracker" = "https://github.com/brenordv/pypi-raccoon-tools/issues"
"Changelog" = "https://github.com/brenordv/pypi-raccoon-tools/blob/master/raccoontools-db/CHANGELOG.md"
"Author" = "https://raccoon.ninja"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true

# The OTEL integration is an optional extra and is not installed in the dev environment.
[[tool.mypy.overrides]]
module = ["simple_log_factory_ext_otel"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"
