[project]
name = "raccoontools"
version = "3.7.0"
description = "A collection of tools, and helpers that I usually want for a handful of projects, so to avoid rewriting them every time, I decided to create this package."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Breno RdV", email = "hello@raccoon.ninja" },
]
maintainers = [
    { name = "Breno RdV", email = "hello@raccoon.ninja" },
]
keywords = ["retry", "decorator", "benchmark", "logging", "requests", "json", "file operations", "serialization", "http", "utilities", "tools", "helpers", "python", "comparison", "diff", "dict"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

requires-python = ">=3.11"

dependencies = [
    "raccoon-simple-stopwatch==0.0.3",
    "simple-log-factory==2.0.0",
    "requests~=2.34.2",
    "pydantic~=2.14.2",
    # Adding this dependency explicitly to solve security issues while requests doesn't catch up. Refs:
    # https://github.com/brenordv/pypi-raccoon-tools/security/dependabot/1
    # https://github.com/brenordv/pypi-raccoon-tools/security/dependabot/2
    "urllib3>=2.8.0",

    # Adding this dependency explicitly to solve security issues while requests doesn't catch up. Refs:
    # https://github.com/brenordv/pypi-raccoon-tools/security/dependabot/5
    # https://github.com/brenordv/pypi-raccoon-tools/security/dependabot/6
    "idna>=3.20"
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "mypy==2.4.1",
    "ruff==0.17.3",
    "types-requests==2.33.0.20261030",
]

[project.urls]
"Homepage" = "https://github.com/brenordv/pypi-raccoon-tools"
"Source" = "https://github.com/brenordv/pypi-raccoon-tools"
"Bug Tracker" = "https://github.com/brenordv/pypi-raccoon-tools/issues"
"Changelog" = "https://github.com/brenordv/pypi-raccoon-tools/blob/master/raccoontools/CHANGELOG.md"
"Author" = "https://raccoon.ninja"

[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
